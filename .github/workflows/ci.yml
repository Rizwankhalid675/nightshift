name: CI

# The eval is a release gate, not a report: it exits non-zero if a wrong action
# would have run unattended, or if a real incident was suppressed. That means a
# regression in the safety layer fails the build like a broken test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # package.json says engines.node >= 20, so both ends of that claim get
    # tested. This matrix is not decoration: "node --test tests/" scanned the
    # directory on 20 and resolved it as a module on 22, so the whole suite
    # failed to load on a version the package said it supported.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: No dependencies to install
        run: test ! -s package-lock.json || echo "lockfile present but empty of deps"

      - name: Tests
        run: npm test

      - name: Safety gate — Northwind (multi-agent)
        run: node src/eval/run.js --tenant northwind-msp --mode multi

      - name: Safety gate — Acme (second tenant, different rule pack)
        run: node src/eval/run.js --tenant acme-retail --mode multi

      - name: Safety gate — single agent baseline
        run: node src/eval/run.js --tenant northwind-msp --mode single

      - name: Safety gate — held-out traffic the rules were never tuned for
        run: node src/eval/run.js --set holdout --mode multi

      - name: Reviewer must catch injected faults
        run: node src/eval/compare.js --assert

      - name: Static export builds
        run: node src/export.js --out dist && test -f dist/index.html
